name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  typecheck:
    name: mypy & flake8
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"  # oldest supported version (python_requires)
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt mypy flake8
      - name: mypy (strict)
        run: python -m mypy --config-file=mypy.ini srudp
      - name: flake8 (syntax errors & undefined names)
        run: python -m flake8 srudp --count --select=E901,E999,F821,F822,F823 --show-source --statistics
      - name: flake8 (warnings only)
        run: python -m flake8 srudp --count --exit-zero --max-complexity=12 --max-line-length=120 --statistics

  test:
    name: test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        # oldest supported version & latest release
        python-version: ["3.11", "3.x"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Show Python version
        run: python -c "import sys, platform; print(sys.version, platform.platform())"
      - name: unittest
        run: python -m unittest -v test
